<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>유통기한 관리 스캐너</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<!-- 상단 및 하단 안전 영역(Safe Area) 패딩 적용 -->
<body class="bg-gray-100 text-gray-800 min-h-screen pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col">
        <!-- 헤더 -->
        <header
            class="bg-blue-600 text-white p-4 font-bold text-lg flex justify-between items-center sticky top-0 z-10">
            <div class="flex items-center space-x-2">
                <span id="header-title">📦 유통기한 관리</span>
                <span id="version-tag" class="text-xs bg-blue-700 px-1.5 py-0.5 rounded text-blue-200 font-mono">v0.0.8</span>
            </div>
            <div class="space-x-2 flex items-center">
                <button onclick="toggleTrashMode()" id="trash-toggle-btn"
                    class="text-xs bg-blue-700 hover:bg-blue-800 px-2.5 py-1 rounded">휴지통</button>
                <a id="excel-btn" href="/api/export/excel" class="text-xs bg-green-600 hover:bg-green-700 px-2.5 py-1 rounded">엑셀</a>
            </div>
        </header>

        <!-- 탭 메뉴 (휴지통에서는 숨김) -->
        <div id="tab-bar" class="flex border-b bg-white text-sm font-semibold text-gray-600">
            <button id="tab-all" onclick="switchTab('all')"
                class="flex-1 py-2 text-center border-b-2 border-blue-600 text-blue-600">개별 목록</button>
            <button id="tab-summary" onclick="switchTab('summary')"
                class="flex-1 py-2 text-center border-b-2 border-transparent text-gray-500">∑ 합계</button>
            <button id="tab-calendar" onclick="switchTab('calendar')"
                class="flex-1 py-2 text-center border-b-2 border-transparent text-gray-500">📅 달력</button>
        </div>
        
        <!-- 메인 콘텐츠 -->
        <main class="p-4 flex-1">
            <!-- 카메라 바코드 스캐너 영역 -->
            <div id="scanner-section" class="mb-4 bg-gray-50 p-2 rounded-lg border border-dashed border-gray-300">
                <div id="reader" class="w-full"></div>
                <button id="toggle-scan-btn" onclick="toggleScanner()"
                    class="w-full mt-2 bg-indigo-600 text-white py-2 rounded-lg font-semibold text-sm">
                    📷 바코드 스캔 시작
                </button>
            </div>

            <!-- 상품 등록 폼 -->
            <form id="item-form" onsubmit="saveItem(event)"
                class="bg-gray-50 p-4 rounded-lg shadow-inner mb-6 space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600">바코드</label>
                    <input type="text" id="barcode" class="w-full p-2 border rounded text-sm bg-gray-100"
                        placeholder="스캔 또는 직접 입력" readonly>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600">상품명 *</label>
                    <input type="text" id="name" required class="w-full p-2 border rounded text-sm"
                        placeholder="예: 신라면 5입">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600">유통기한 *</label>
                        <input type="date" id="expiry_date" required class="w-full p-2 border rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600">수량</label>
                        <input type="number" id="quantity" value="1" min="1" class="w-full p-2 border rounded text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600">보관 위치</label>
                    <input class="w-full p-2 border rounded text-sm bg-white" list="locationOptions" id="location"
                        name="location" value="기본" placeholder="위치 선택 또는 직접 입력">
                    <datalist id="locationOptions">
                        <option value="기본">
                        <option value="냉장실">
                        <option value="냉동실">
                        <option value="팬트리">
                    </datalist>
                </div>
                <button type="submit"
                    class="w-full bg-green-600 text-white py-2 rounded-lg font-bold text-sm hover:bg-green-700">등록하기</button>
            </form>

            <!-- 검색 및 정렬 컨트롤 바 (휴지통에서는 숨김) -->
            <div id="search-sort-section" class="mb-3 space-y-2">
                <input type="text" id="search-input" oninput="loadItems()" placeholder="🔍 상품명, 바코드, 위치 검색..."
                    class="w-full p-2 border rounded text-sm bg-gray-50">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-600" id="list-heading">재고 현황</span>
                    <select id="sort-select" onchange="loadItems()"
                        class="text-xs p-1.5 border rounded bg-white text-gray-700">
                        <option value="expiry_asc">▲ 유통기한 오름차순</option>
                        <option value="expiry_desc">▼ 유통기한 내림차순</option>
                        <option value="name_asc">▲ 상품명 오름차순</option>
                        <option value="name_desc">▼ 상품명 내림차순</option>
                        <option value="quantity_asc">▲ 수량 오름차순</option>
                        <option value="quantity_desc">▼ 수량 내림차순</option>
                        <option value="barcode_asc">▲ 바코드 오름차순</option>
                    </select>
                </div>
            </div>

            <!-- 재고 목록 컨테이너 -->
            <div id="item-list" class="space-y-2 mb-10"></div>
        </main>
    </div>

    <script>
        let html5QrcodeScanner = null;
        let isScanning = false;
        let isTrashView = false;
        let currentTab = 'all';

        // 페이지 로드 시 기존 보관 위치 목록 불러오기
        function loadLocations() {
            fetch('/api/locations')
                .then(res => res.json())
                .then(locations => {
                    const datalist = document.getElementById('locationOptions');
                    if (datalist) {
                        datalist.innerHTML = '';
                        locations.forEach(loc => {
                            const opt = document.createElement('option');
                            opt.value = loc;
                            datalist.appendChild(opt);
                        });
                    }
                })
                .catch(err => console.log('Locations load error:', err));
        }

        function toggleScanner() {
            const btn = document.getElementById('toggle-scan-btn');
            if (!isScanning) {
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    onScanSuccess
                ).catch(err => alert("카메라 접근 권한이 필요합니다."));
                btn.innerText = "⏹ 스캔 중지";
                btn.classList.replace('bg-indigo-600', 'bg-red-600');
                isScanning = true;
            } else {
                stopScanner();
            }
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader').innerHTML = '';
                    const btn = document.getElementById('toggle-scan-btn');
                    btn.innerText = "📷 바코드 스캔 시작";
                    btn.classList.replace('bg-red-600', 'bg-indigo-600');
                    isScanning = false;
                });
            }
        }

        function onScanSuccess(decodedText) {
            document.getElementById('barcode').value = decodedText;
            stopScanner();

            fetch(`/api/barcode/${decodedText}`)
                .then(res => res.json())
                .then(data => {
                    if (data.name) {
                        document.getElementById('name').value = data.name;
                    }
                    document.getElementById('expiry_date').focus();
                });
        }

        function saveItem(e) {
            e.preventDefault();
            const data = {
                barcode: document.getElementById('barcode').value,
                name: document.getElementById('name').value,
                expiry_date: document.getElementById('expiry_date').value,
                quantity: parseInt(document.getElementById('quantity').value) || 1,
                location: document.getElementById('location').value || '기본'
            };

            fetch('/api/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(res => res.json())
                .then(responseData => {
                    if (responseData.success) {
                        alert('성공적으로 등록되었습니다!');
                        document.getElementById('item-form').reset();
                        document.getElementById('barcode').value = '';
                        document.getElementById('location').value = '기본';
                        document.getElementById('quantity').value = 1;
                        loadItems();
                        loadLocations();
                    } else {
                        alert('등록 실패: ' + (responseData.message || '알 수 없는 오류'));
                    }
                })
                .catch(err => {
                    console.error('Save error:', err);
                    alert('서버 통신 중 오류가 발생했습니다.');
                });
        }

        function deleteItem(id) {
            if (confirm('휴지통으로 이동하시겠습니까?')) {
                fetch(`/api/items/${id}`, { method: 'DELETE' })
                    .then(() => loadItems());
            }
        }

        function restoreItem(id) {
            fetch(`/api/items/${id}/restore`, { method: 'POST' })
                .then(() => loadItems());
        }

        function permanentDelete(id) {
            if (confirm('영구 삭제하시겠습니까? 복구할 수 없습니다.')) {
                fetch(`/api/items/${id}/permanent`, { method: 'DELETE' })
                    .then(() => loadItems());
            }
        }

        // 달력 등에서 항목 클릭 시 개별 목록으로 이동하며 해당 상품명으로 검색 연동
        function filterByItem(name) {
            switchTab('all');
            document.getElementById('search-input').value = name;
            loadItems();
        }

        // 합계 화면에서 항목 클릭 시 하단에 상세 내역 토글(펼치기/접기)
        function toggleSummaryDetail(name, element) {
            const detailId = `detail-${CSS.escape(name)}`;
            const existingDetail = document.getElementById(detailId);
            
            if (existingDetail) {
                existingDetail.remove();
                return;
            }

            // 다른 열려있는 상세 영역들 모두 닫기
            document.querySelectorAll('.summary-detail').forEach(el => el.remove());

            // 서버에서 해당 상품의 상세 목록 가져오기
            let url = `/api/items?q=${encodeURIComponent(name)}`;
            fetch(url)
                .then(res => res.json())
                .then(items => {
                    let itemsHtml = items.map(i => `
                        <div class="flex justify-between items-center text-xs py-1.5 border-b last:border-none">
                            <span>📅 기한: ${i.expiry_date} | 수량: ${i.quantity}개 | 위치: ${i.location}</span>
                            <span class="px-1.5 py-0.5 rounded ${i.status === 'expired' ? 'bg-red-100 text-red-800 font-bold' : 'bg-green-100 text-green-800'}">D-${i.days_left}</span>
                        </div>
                    `).join('');

                    const detailDiv = document.createElement('div');
                    detailDiv.id = detailId;
                    detailDiv.className = "summary-detail bg-gray-50 p-3 rounded-lg border border-blue-200 mt-2 space-y-1 shadow-inner";
                    detailDiv.innerHTML = `
                        <div class="text-xs font-bold text-blue-700 mb-1">📦 [${name}] 상세 내역 (${items.length}건)</div>
                        ${itemsHtml || '<div class="text-gray-400 text-xs py-1">상세 항목이 없습니다.</div>'}
                    `;

                    element.after(detailDiv);
                });
        }

        // 휴지통 모드: 상단 메뉴, 탭, 검색바 숨기고 리스트만 깔끔하게 표시
        function toggleTrashMode() {
            isTrashView = !isTrashView;
            const trashBtn = document.getElementById('trash-toggle-btn');
            const headerTitle = document.getElementById('header-title');
            const versionTag = document.getElementById('version-tag');
            const excelBtn = document.getElementById('excel-btn');
            const scannerSection = document.getElementById('scanner-section');
            const itemForm = document.getElementById('item-form');
            const tabBar = document.getElementById('tab-bar');
            const searchSortSection = document.getElementById('search-sort-section');

            if (isTrashView) {
                trashBtn.innerText = "목록으로";
                trashBtn.classList.replace('bg-blue-700', 'bg-gray-700');
                headerTitle.innerText = "🗑 휴지통";
                versionTag.style.display = 'none';
                excelBtn.style.display = 'none';
                tabBar.style.display = 'none';
                scannerSection.style.display = 'none';
                itemForm.style.display = 'none';
                searchSortSection.style.display = 'none';
            } else {
                trashBtn.innerText = "휴지통";
                trashBtn.classList.replace('bg-gray-700', 'bg-blue-700');
                headerTitle.innerText = "📦 유통기한 관리";
                versionTag.style.display = 'inline-block';
                excelBtn.style.display = 'inline-block';
                tabBar.style.display = 'flex';
                scannerSection.style.display = 'block';
                itemForm.style.display = 'block';
                searchSortSection.style.display = 'block';
            }
            loadItems();
        }

        function loadItems() {
            const sortVal = document.getElementById('sort-select').value;
            const searchVal = document.getElementById('search-input').value;

            let url = `/api/items?sort=${sortVal}&trash=${isTrashView}`;
            if (searchVal) {
                url += `&q=${encodeURIComponent(searchVal)}`;
            }

            fetch(url)
                .then(res => res.json())
                .then(items => {
                    const listContainer = document.getElementById('item-list');
                    listContainer.innerHTML = '';

                    if (items.length === 0) {
                        listContainer.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">항목이 없습니다.</div>`;
                        return;
                    }

                    items.forEach(item => {
                        let badgeColor = 'bg-green-100 text-green-800';
                        let statusText = `D-${item.days_left}`;

                        if (item.status === 'expired') {
                            badgeColor = 'bg-red-100 text-red-800 font-bold';
                            statusText = `만료 (${Math.abs(item.days_left)}일 지남)`;
                        } else if (item.status === 'warning') {
                            badgeColor = 'bg-yellow-100 text-yellow-800 font-bold';
                            statusText = `D-${item.days_left} (임박)`;
                        }

                        let actionButtons = `<button onclick="deleteItem(${item.id})" class="text-gray-400 hover:text-red-500 p-1 text-sm" title="휴지통으로 이동">🗑</button>`;

                        if (item.is_deleted === 1) {
                            badgeColor = 'bg-gray-200 text-gray-700';
                            statusText = '휴지통 보관중';
                            actionButtons = `
                                <button onclick="restoreItem(${item.id})" class="text-blue-500 hover:text-blue-700 px-2 py-1 text-xs font-bold border rounded bg-blue-50">복원</button>
                                <button onclick="permanentDelete(${item.id})" class="text-red-500 hover:text-red-700 px-2 py-1 text-xs font-bold border rounded bg-blue-50">영구삭제</button>
                            `;
                        }

                        const card = `
                            <div class="bg-white p-3 rounded-lg border shadow-sm flex justify-between items-center">
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <span class="font-bold text-sm">${item.name}</span>
                                        <span class="text-xs px-2 py-0.5 rounded-full ${badgeColor}">${statusText}</span>
                                    </div>
                                    <div class="text-xs text-gray-500 mt-1">
                                        기한: ${item.expiry_date} | 수량: ${item.quantity}개 | 위치: ${item.location}
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    ${actionButtons}
                                </div>
                            </div>
                        `;
                        listContainer.innerHTML += card;
                    });
                });
        }

        function switchTab(tab) {
            currentTab = tab;
            const tabAll = document.getElementById('tab-all');
            const tabSummary = document.getElementById('tab-summary');
            const tabCalendar = document.getElementById('tab-calendar');
            const sortSelect = document.getElementById('sort-select');
            const scannerSection = document.getElementById('scanner-section');
            const itemForm = document.getElementById('item-form');
            const searchInput = document.getElementById('search-input');

            [tabAll, tabSummary, tabCalendar].forEach(el => el.className = "flex-1 py-2 text-center border-b-2 border-transparent text-gray-500");

            if (tab === 'all') {
                tabAll.className = "flex-1 py-2 text-center border-b-2 border-blue-600 text-blue-600";
                sortSelect.parentElement.style.display = 'flex';
                scannerSection.style.display = 'block';
                itemForm.style.display = 'block';
                // 개별 목록 탭으로 돌아올 때 검색어를 초기화하여 전체 리스트가 나오도록 보장
                searchInput.value = '';
                loadItems();
            } else if (tab === 'summary') {
                tabSummary.className = "flex-1 py-2 text-center border-b-2 border-blue-600 text-blue-600";
                sortSelect.parentElement.style.display = 'none';
                scannerSection.style.display = 'none';
                itemForm.style.display = 'none';
                loadSummary();
            } else if (tab === 'calendar') {
                tabCalendar.className = "flex-1 py-2 text-center border-b-2 border-blue-600 text-blue-600";
                sortSelect.parentElement.style.display = 'none';
                scannerSection.style.display = 'none';
                itemForm.style.display = 'none';
                loadCalendarView();
            }
        }

        function loadSummary() {
            fetch('/api/items/summary')
                .then(res => res.json())
                .then(items => {
                    const listContainer = document.getElementById('item-list');
                    listContainer.innerHTML = '';

                    if (items.length === 0) {
                        listContainer.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">합계 데이터가 없습니다.</div>`;
                        return;
                    }

                    items.forEach(item => {
                        let badgeColor = item.days_left < 0 ? 'bg-red-100 text-red-800' : (item.days_left <= 7 ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800');

                        const cardWrapper = document.createElement('div');
                        cardWrapper.className = "mb-2";
                        
                        // 합계 항목 클릭 시 개별 페이지 이동 대신 하단에 토글 형태로 상세 내역 표시
                        cardWrapper.innerHTML = `
                            <div onclick='toggleSummaryDetail("${item.name}", this.parentNode)' class="bg-white p-3 rounded-lg border shadow-sm flex justify-between items-center cursor-pointer hover:bg-blue-50 transition">
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <span class="font-bold text-sm">${item.name}</span>
                                        <span class="text-xs text-gray-400">(${item.barcode})</span>
                                    </div>
                                    <div class="text-xs text-gray-500 mt-1">
                                        가장 빠른 기한: <span class="font-semibold">${item.earliest_expiry}</span> 
                                        <span class="px-1.5 py-0.5 rounded ${badgeColor} text-xs">D-${item.days_left}</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs text-gray-400">등록 ${item.item_count}건</span>
                                    <div class="text-lg font-bold text-blue-600">총 ${item.total_quantity}개</div>
                                </div>
                            </div>
                        `;
                        listContainer.appendChild(cardWrapper);
                    });
                });
        }

        function loadCalendarView() {
            const currentYM = new Date().toISOString().slice(0, 7);
            fetch(`/api/items/calendar?ym=${currentYM}`)
                .then(res => res.json())
                .then(data => {
                    const listContainer = document.getElementById('item-list');
                    listContainer.innerHTML = `
                        <div class="mb-3 bg-blue-50 p-3 rounded-lg text-center text-xs font-bold text-blue-700">
                            📅 ${currentYM} 유통기한 마감 캘린더 (항목 클릭 시 검색)
                        </div>
                    `;

                    if (Object.keys(data).length === 0) {
                        listContainer.innerHTML += `<div class="text-center py-8 text-gray-400 text-sm">이번 달 마감되는 품목이 없습니다.</div>`;
                        return;
                    }

                    for (const [dateStr, items] of Object.entries(data)) {
                        // 달력 내부 항목 클릭 시 개별 목록으로 이동하며 해당 상품명으로 검색
                        let itemsHtml = items.map(i => `
                            <div onclick="filterByItem('${i.name}')" class="flex justify-between items-center text-xs py-1.5 border-b last:border-none cursor-pointer hover:text-blue-600 font-medium">
                                <span>📦 ${i.name} (${i.quantity}개)</span>
                                <span class="text-gray-500">위치: ${i.location}</span>
                            </div>
                        `).join('');

                        listContainer.innerHTML += `
                            <div class="bg-white p-3 rounded-lg border shadow-sm mb-2">
                                <div class="text-xs font-bold text-red-600 mb-1">📌 ${dateStr} 마감</div>
                                ${itemsHtml}
                            </div>
                        `;
                    }
                });
        }

        // 초기 실행
        loadItems();
        loadLocations();
    </script>
</body>

</html>
